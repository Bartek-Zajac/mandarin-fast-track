name: Build Core 1000 data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_core1000.py'
      - '.github/workflows/build-core1000.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Core 1000
        run: python scripts/build_core1000.py
      - name: Commit generated data
        run: |
          if git diff --quiet -- core1000-data.js && git ls-files --error-unmatch core1000-data.js >/dev/null 2>&1; then
            echo 'Core 1000 data is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core1000-data.js
          git commit -m 'Generate Core 1000 frequency data'
          git push
